<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umislo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{background:#1f8a4c}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);overflow-x:hidden}
.track{height:340vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;
  background:linear-gradient(180deg,#0c60ce 0%,#3d9cf2 30%,#86c9fa 56%,#cdeafd 80%,#eaf8ff 100%);background-size:100% 220%;background-position:0 0}
.layer{position:absolute;left:0;width:100%;will-change:transform}
.sun{top:34%;left:50%;width:min(60vw,560px);aspect-ratio:1;margin-left:calc(min(60vw,560px)/-2);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,250,.95) 0%,rgba(255,252,225,.45) 30%,rgba(255,255,255,0) 68%)}
.cloud{position:absolute;filter:blur(2px);opacity:.92}
.cloud i{position:absolute;background:#fff;border-radius:50%}
.hills{bottom:0;height:62vh}
.hills svg,.grass svg{width:100%;height:100%;display:block}
.grass{bottom:0;height:34vh}
.logo{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;z-index:5;
  font-family:"Instrument Serif",Georgia,serif;font-size:30px;text-shadow:0 1px 12px rgba(0,40,90,.25)}
.logo img{width:36px;height:36px}
.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;z-index:4;will-change:transform,opacity}
h1{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;line-height:.98;letter-spacing:-.015em;
  font-size:clamp(58px,12.5vw,176px);max-width:11ch;text-shadow:0 4px 40px rgba(0,50,110,.28)}
h1 em{font-style:normal}
.hint{margin-top:28px;font-size:14px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hint span{display:block;margin:10px auto 0;width:1px;height:38px;background:#fff;animation:drop 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drop{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.end{opacity:0;pointer-events:none}
.end h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(44px,8vw,104px);line-height:1;text-shadow:0 3px 24px rgba(0,30,10,.4)}
.end h2 em{font-style:normal}
.end p{margin:18px 0 26px;font-size:18px;text-shadow:0 1px 14px rgba(0,30,10,.5)}
.end a{pointer-events:auto;display:inline-block;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:13px 30px;border-radius:12px;text-decoration:none;font-weight:500;font-size:15px}
</style>
</head>

    <div class="layer hills" id="hNear"><svg viewBox="0 0 1440 400" preserveAspectRatio="none"><path fill="#2a9d5a" d="M0 300 C240 230 460 300 720 290 S1160 220 1440 290 V400 H0Z"/></svg></div>

    <div class="copy" id="hero">
      <h1>We’re working on <em>something big</em>…</h1>
    </div>
    <div class="copy end" id="end">
      <h2>Umislo, <em>growing</em> soon.</h2>
      <p>Something good is taking root. Check back shortly.</p>
    </div>

    <div class="layer grass" id="grass"><svg id="blades" viewBox="0 0 1440 300" preserveAspectRatio="none"></svg></div>
  </div>
</div>

<script>
(function(){
  var track=document.getElementById('track'),stage=document.getElementById('stage'),
      el=function(i){return document.getElementById(i)},
      sun=el('sun'),clouds=el('clouds').children,hF=el('hFar'),hM=el('hMid'),hN=el('hNear'),gr=el('grass'),hero=el('hero'),end=el('end');
  function clamp(v){return Math.max(0,Math.min(1,v))}
  function update(){
    var vh=window.innerHeight,max=track.offsetHeight-vh,p=clamp(window.scrollY/max);
    stage.style.backgroundPosition='0 '+(p*100)+'%';
    sun.style.transform='translateY('+(-p*vh*.25)+'px) scale('+(1+p*.3)+')';
    for(var i=0;i<clouds.length;i++){var s=parseFloat(clouds[i].dataset.s);
      clouds[i].style.transform='translate('+(p*s*160)+'px,'+(-p*s*vh*.12)+'px)';}
    hF.style.transform='translateY('+((1-p)*vh*.30)+'px)';
    hM.style.transform='translateY('+((1-p)*vh*.42)+'px)';
    hN.style.transform='translateY('+((1-p)*vh*.54)+'px)';
    gr.style.transform='translateY('+((1-p)*vh*.42-p*vh*.04)+'px)';
    var a=clamp(1-p*3.2);
    hero.style.opacity=a;hero.style.transform='translateY('+(-p*vh*.35)+'px) scale('+(1+p*.12)+')';
    var b=clamp((p-.62)/.28);
    end.style.opacity=b;end.style.transform='translateY('+((1-b)*40)+'px)';
    end.style.pointerEvents=b>.5?'auto':'none';
  }
  var tick=false;
  window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(function(){update();tick=false})}},{passive:true});
  window.addEventListener('resize',update);update();
})();
</script>
</body>
</html>
